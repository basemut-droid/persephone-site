# Decap CMS configuration.
#
# Backend: GitHub, via a self-hosted OAuth broker (base_url below) rather than
# Netlify Identity/git-gateway — Netlify Identity was retired for new projects,
# and hosting is easyname, not Netlify, so git-gateway was never an option
# here (see docs/decisions.md, Hosting-Entscheidung 2026-09-13).
#
# base_url points at a small Cloudflare Worker that brokers GitHub's OAuth
# handshake (GitHub requires a client secret for the token exchange, which
# must never reach the browser). The worker's source lives in
# cms-oauth-worker/ at the repo root — see cms-oauth-worker/README.md for the
# one-time setup (a GitHub OAuth App + deploying the worker). Once deployed,
# replace the placeholder URL below with the worker's real one.
backend:
  name: github
  repo: basemut-droid/persephone-site
  branch: main
  base_url: "https://REPLACE-WITH-YOUR-WORKER-URL.workers.dev" # TODO: set after deploying cms-oauth-worker/

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

locale: "de"

collections:
  # --- Site-wide + homepage text (see src/content/site/*.json) ---
  # Every section of src/content.config.ts's `site` schema is now represented
  # below, matching that file field-for-field (nav/painPoints/philosophy/
  # founder/newsletter/footer/common added; previously only meta/hero/services
  # existed as a pattern example).
  - name: "site"
    label: "Website-Texte"
    files:
      - name: "de"
        label: "Deutsch"
        file: "src/content/site/de.json"
        fields: &site_fields
          - { label: "Status", name: "reviewStatus", widget: "select", options: ["native", "ai-draft"] }
          - label: "Meta (SEO)"
            name: "meta"
            widget: "object"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Beschreibung", name: "description", widget: "text" }
          - label: "Navigation"
            name: "nav"
            widget: "object"
            fields:
              - label: "Menüpunkte"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Text", name: "label", widget: "string" }
                  - { label: "Link", name: "href", widget: "string" }
                  - label: "Untermenü (optional)"
                    name: "children"
                    widget: "list"
                    required: false
                    fields:
                      - { label: "Text", name: "label", widget: "string" }
                      - { label: "Link", name: "href", widget: "string" }
              - { label: "Button-Text", name: "cta", widget: "string" }
              - { label: "Button-Ziel", name: "ctaHref", widget: "string" }
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Überschrift", name: "headline", widget: "string" }
              - { label: "Absätze", name: "paragraphs", widget: "list", field: { label: "Absatz", name: "paragraph", widget: "text" } }
              - { label: "Button-Text", name: "cta", widget: "string" }
              - { label: "Button-Ziel", name: "ctaHref", widget: "string" }
          - label: "Pain Points (\"Kennst Du das?\")"
            name: "painPoints"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Überschrift", name: "heading", widget: "string", hint: "Einfache <em>-Hervorhebung ist erlaubt, sonst kein HTML." }
              - { label: "Absätze", name: "paragraphs", widget: "list", field: { label: "Absatz", name: "paragraph", widget: "text" } }
              - { label: "Zitate", name: "quotes", widget: "list", field: { label: "Zitat", name: "quote", widget: "string" } }
              - { label: "Abschluss-Satz", name: "closing", widget: "text" }
          - label: "Angebote"
            name: "services"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Überschrift", name: "heading", widget: "string" }
              - label: "Karten"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Titel", name: "title", widget: "string" }
                  - { label: "Beschreibung", name: "description", widget: "text" }
                  - { label: "Link", name: "href", widget: "string" }
                  - { label: "Button-Text", name: "cta", widget: "string" }
          - label: "Philosophie/Werte"
            name: "philosophy"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Überschrift", name: "heading", widget: "string" }
              - { label: "Absätze", name: "paragraphs", widget: "list", field: { label: "Absatz", name: "paragraph", widget: "text" } }
              - label: "Werte"
                name: "values"
                widget: "list"
                fields:
                  - { label: "Titel", name: "title", widget: "string" }
                  - { label: "Beschreibung", name: "description", widget: "text" }
          - label: "Über die Gründerin"
            name: "founder"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Überschrift", name: "heading", widget: "string" }
              - { label: "Absätze", name: "paragraphs", widget: "list", field: { label: "Absatz", name: "paragraph", widget: "text" } }
              - { label: "Button-Text", name: "cta", widget: "string" }
              - { label: "Button-Ziel", name: "href", widget: "string" }
              - { label: "Bild Alt-Text", name: "imageAlt", widget: "string" }
          - label: "Newsletter-Anmeldung"
            name: "newsletter"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Überschrift", name: "heading", widget: "string" }
              - { label: "Absätze", name: "paragraphs", widget: "list", field: { label: "Absatz", name: "paragraph", widget: "text" } }
              - { label: "Button-Text", name: "cta", widget: "string" }
              - { label: "Button-Ziel", name: "ctaHref", widget: "string" }
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Slogan", name: "tagline", widget: "string" }
              - { label: "Newsletter-Eyebrow", name: "newsletterEyebrow", widget: "string" }
              - { label: "Newsletter-Button", name: "newsletterCta", widget: "string" }
              - label: "Spalten"
                name: "columns"
                widget: "list"
                fields:
                  - { label: "Titel", name: "title", widget: "string" }
                  - label: "Links"
                    name: "links"
                    widget: "list"
                    fields:
                      - { label: "Text", name: "label", widget: "string" }
                      - { label: "Ziel", name: "href", widget: "string" }
              - { label: "Copyright-Zeile", name: "copyright", widget: "string" }
          - label: "Wiederkehrende Kleintexte"
            name: "common"
            widget: "object"
            hint: "Kurze Textbausteine, die an mehreren Stellen der Seite auftauchen."
            fields:
              - { label: "\"Zum Inhalt springen\"", name: "skipToContent", widget: "string" }
              - { label: "\"Weiterlesen\"", name: "readMore", widget: "string" }
              - { label: "Sprachumschalter-Beschriftung", name: "languageSwitcherLabel", widget: "string" }
              - { label: "Entwurfs-Hinweis (KI-Übersetzung)", name: "draftNotice", widget: "text" }
              - { label: "Hinweis \"noch nicht übersetzt\"", name: "blogFallbackNotice", widget: "text" }
      - name: "en"
        label: "English"
        file: "src/content/site/en.json"
        fields: *site_fields
      - name: "it"
        label: "Italiano"
        file: "src/content/site/it.json"
        fields: *site_fields

  # --- Blog posts: one folder per locale (Decap's "multiple_folders" i18n
  # structure), matching src/content/blog/<locale>/*.md ---
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog/de"
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - { label: "Titel", name: "title", widget: "string", i18n: true }
      - { label: "Beschreibung", name: "description", widget: "text", i18n: true }
      - { label: "Veröffentlicht am", name: "publishDate", widget: "datetime", i18n: "duplicate" }
      # Widened from "string" to a list of strings, 2026-09-13: matches
      # src/content.config.ts's `category: z.array(z.string())` (widened
      # there on FIXES-2026-09-07.md task 3, but this file was never updated
      # to match — a real mismatch, since the old "string" widget here would
      # have saved a single string where the schema now expects a list).
      - label: "Kategorien"
        name: "category"
        widget: "list"
        required: false
        i18n: true
        field: { label: "Kategorie", name: "category", widget: "string" }
      - { label: "Titelbild", name: "heroImage", widget: "image", required: false, i18n: "duplicate" }
      - { label: "Bild Alt-Text", name: "heroImageAlt", widget: "string", required: false, i18n: true }
      - { label: "Entwurf", name: "draft", widget: "boolean", default: true }
      - { label: "Inhalt", name: "body", widget: "markdown", i18n: true }

  # --- Events: same locale-folder pattern, ready for phase 2 ---
  - name: "events"
    label: "Termine"
    folder: "src/content/events/de"
    create: true
    slug: "{{slug}}"
    i18n: true
    fields:
      - { label: "Titel", name: "title", widget: "string", i18n: true }
      - { label: "Beschreibung", name: "description", widget: "text", i18n: true }
      - { label: "Beginn", name: "startDate", widget: "datetime", i18n: "duplicate" }
      - { label: "Ende", name: "endDate", widget: "datetime", required: false, i18n: "duplicate" }
      - { label: "Ort", name: "location", widget: "string", i18n: "duplicate" }
      - { label: "Online?", name: "isOnline", widget: "boolean", default: false, i18n: "duplicate" }
      - { label: "Bild", name: "image", widget: "image", required: false, i18n: "duplicate" }
      - { label: "Preis", name: "price", widget: "string", required: false, i18n: true }
      - { label: "Anmeldelink", name: "registrationUrl", widget: "string", required: false, i18n: "duplicate" }
      - { label: "Entwurf", name: "draft", widget: "boolean", default: true }
      - { label: "Inhalt", name: "body", widget: "markdown", i18n: true }
